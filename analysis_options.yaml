include: package:lints/recommended.yaml

analyzer:
  errors:
    unused_import: error
    dead_code: error
    avoid_print: ignore

linter:
  rules:
    always_declare_return_types: true
    prefer_final_locals: true
    avoid_print: true
    directives_ordering: true
    curly_braces_in_flow_control_structures: false
